<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;700;900&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface": "#111316",
            "on-secondary-container": "#83bfc3",
            "on-error": "#690005",
            "on-secondary-fixed": "#002021",
            "on-primary-fixed": "#002021",
            "surface-tint": "#00dce5",
            "surface-dim": "#111316",
            "secondary": "#95d1d4",
            "on-primary": "#003739",
            "on-surface-variant": "#b9caca",
            "secondary-fixed-dim": "#95d1d4",
            "surface-container-low": "#1a1c1f",
            "primary": "#e9feff",
            "secondary-container": "#044f52",
            "on-tertiary-fixed-variant": "#544600",
            "error-container": "#93000a",
            "surface-container-lowest": "#0c0e11",
            "on-error-container": "#ffdad6",
            "inverse-surface": "#e2e2e6",
            "primary-container": "#00f5ff",
            "tertiary-fixed-dim": "#e7c427",
            "on-tertiary-fixed": "#221b00",
            "primary-fixed": "#63f7ff",
            "surface-container-highest": "#333538",
            "tertiary": "#fff9f0",
            "on-surface": "#e2e2e6",
            "on-tertiary-container": "#736000",
            "error": "#ffb4ab",
            "on-secondary": "#003739",
            "surface-variant": "#333538",
            "inverse-primary": "#00696e",
            "secondary-fixed": "#b0edf1",
            "outline": "#849495",
            "surface-container": "#1e2023",
            "on-primary-fixed-variant": "#004f53",
            "on-tertiary": "#3a3000",
            "on-primary-container": "#006c71",
            "surface-container-high": "#282a2d",
            "background": "#111316",
            "primary-fixed-dim": "#00dce5",
            "tertiary-fixed": "#ffe16c",
            "surface-bright": "#37393d",
            "inverse-on-surface": "#2f3034",
            "tertiary-container": "#ffdb3f",
            "on-secondary-fixed-variant": "#044f52",
            "on-background": "#e2e2e6",
            "outline-variant": "#3a494a"
          },
          fontFamily: {
            "headline": ["Epilogue"],
            "body": ["Inter"],
            "label": ["Inter"]
          },
          borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
        },
      },
    }
  </script>
<style>
    .luminous-gradient {
      background: linear-gradient(135deg, #63f7ff 0%, #00f5ff 100%);
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body selection:bg-primary-container/30">
<!-- Background Texture -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary-container/5 blur-[120px]"></div>
<div class="absolute top-[20%] -right-[5%] w-[30%] h-[50%] rounded-full bg-primary-container/3 blur-[100px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12">
<!-- Brand Anchor -->
<header class="mb-12 text-center">
<div class="flex items-center justify-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary-container text-4xl" data-icon="link">link</span>
</div>
<h1 class="font-headline text-5xl font-black text-primary-container tracking-tighter mb-2">LinkDrop</h1>
<p class="font-label text-sm uppercase tracking-[0.2em] text-outline opacity-80">Editorial Authority</p>
</header>
<!-- Auth Card -->
<section class="w-full max-w-md">
<div class="bg-surface-container-low rounded-xl p-8 md:p-12 shadow-[0_32px_64px_-12px_rgba(0,0,0,0.6)] relative overflow-hidden border border-outline-variant/10">
<!-- Subtle Spotlight Effect -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/5 blur-3xl pointer-events-none"></div>
<div class="relative z-10">
<h2 class="font-headline text-2xl font-bold text-white mb-8 tracking-tight">Welcome back</h2>
<!-- Form Fields -->
<form class="space-y-6">
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold text-outline tracking-wider uppercase ml-1" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="mail">mail</span>
<input class="w-full bg-surface-container-high border-none rounded-lg py-4 pl-12 pr-4 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary-container/40 transition-all outline-none" id="email" placeholder="manager@linkdrop.com" type="email"/>
</div>
</div>
<div class="space-y-1.5">
<label class="font-label text-xs font-semibold text-outline tracking-wider uppercase ml-1" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-xl" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-high border-none rounded-lg py-4 pl-12 pr-12 text-on-surface placeholder:text-outline/40 focus:ring-1 focus:ring-primary-container/40 transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<button class="w-full luminous-gradient text-on-primary-fixed font-headline font-bold py-4 rounded-full shadow-lg shadow-primary-container/20 hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 mt-4" type="submit">
              Sign In
            </button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow border-t border-outline-variant/20"></div>
<span class="mx-4 font-label text-xs text-outline uppercase tracking-widest">or continue with</span>
<div class="flex-grow border-t border-outline-variant/20"></div>
</div>
<!-- OAuth Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-highest hover:bg-surface-bright text-on-surface py-3.5 rounded-lg transition-all border border-outline-variant/5">
<img alt="" class="w-5 h-5" data-alt="Official Google 'G' icon with multi-color branding on a white circular background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqun8tMiSkqxxt8FN8RrRla4zfV3BY3iCDlla7rZnLPVaiPezHDUYdr0bYLx46sQ-matxsFlzDgBMfz9ozz6d9rNHHIIluFdKHSm0_x5nvPBZrzcBW4DkGWLXRK9jUh-c4PTC6XoEiU_h5k-J4CbWdVcEfapRwbvbeDGZrol5snkPbnyM5pkGddPt-P4Hel0gh8D8LPteLHVJG7p823nbcphgBEVcM9uuVFTOd6PdKd82dEiLehCVQd64KRucCru2pI7nKAg2n2Hs"/>
<span class="text-sm font-medium">Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-highest hover:bg-surface-bright text-on-surface py-3.5 rounded-lg transition-all border border-outline-variant/5">
<span class="material-symbols-outlined text-xl" data-icon="terminal">terminal</span>
<span class="text-sm font-medium">GitHub</span>
</button>
</div>
<!-- Toggle Footer -->
<div class="mt-10 text-center">
<p class="text-outline text-sm">
              Don't have an account? 
              <a class="text-primary-container font-semibold hover:underline decoration-primary-container/30 underline-offset-4 ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</div>
</section>
<!-- Support Link -->
<footer class="mt-12">
<a class="font-label text-xs text-outline hover:text-white uppercase tracking-[0.2em] transition-colors flex items-center gap-2" href="#">
<span class="material-symbols-outlined text-sm" data-icon="help_outline">help_outline</span>
        Need help?
      </a>
</footer>
</main>
<!-- Ghost Element for Interaction Feel -->
<div class="fixed bottom-8 right-8 opacity-20 pointer-events-none hidden md:block">
<div class="font-headline font-black text-8xl text-surface-container-highest select-none">DROP</div>
</div>
</body></html>
